name: Profile summary cards

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Use a PAT secret (SUMMARY_GITHUB_TOKEN) to include private contributions;
          # falls back to the built-in token, which only sees public activity.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          AUTO_PUSH: false

      # Widen the stats card from 340 to 500px so it lines up with the streak card,
      # moving the GitHub logo to stay right-aligned.
      - name: Widen stats card
        run: |
          for f in profile-summary-card-output/*/3-stats.svg; do
            sed -i -E \
              -e 's/width="340" height="200" viewBox="0 0 340 200"/width="500" height="200" viewBox="0 0 500 200"/' \
              -e 's/width="99\.41176470588235%"/width="498"/' \
              -e 's/translate\(220,20\)/translate(380,20)/' \
              "$f"
          done

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --cached --quiet || { git commit -m "Update profile summary cards" && git push; }
