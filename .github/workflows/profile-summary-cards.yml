name: Update profile

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Use a PAT secret (SUMMARY_GITHUB_TOKEN) to include private contributions;
          # falls back to the built-in token, which only sees public activity.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          AUTO_PUSH: false

      # The README shows the stats card at 150px high, so widen it to line up with
      # the streak card and enlarge its text, icons and logo to stay readable.
      - name: Restyle stats card
        run: python3 .github/scripts/restyle_stats_card.py profile-summary-card-output/*/3-stats.svg

      - name: Update Agents in Practice section
        continue-on-error: true # still commit the cards if the catalog is unreachable
        run: python3 .github/scripts/update_agents_in_practice.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output README.md
          git diff --cached --quiet || { git commit -m "Update profile cards and Agents in Practice" && git push; }
